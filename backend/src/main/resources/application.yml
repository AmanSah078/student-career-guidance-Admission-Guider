server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: student-career-guidance-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_career_guidance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:@Bihari078}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:${SMTP_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${SMTP_USER:hind078nobody@gmail.com}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${SMTP_PASS:ihewxeokkbjaqkec}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
  app:
    mail:
      from: ${SMTP_FROM:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:hind078nobody@gmail.com}}}

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:5173,https://enchanting-maamoul-0343b2.netlify.app}"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  verification:
    otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  sms:
    default-country-code: ${SMS_DEFAULT_COUNTRY_CODE:+91}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-phone: ${TWILIO_FROM_PHONE:}

logging:
  level:
    root: INFO
    com.careerguidance: INFO
